<div class="calendar-grid">
  <div *ngFor="let day of calendarDays" class="calendar-day bg-white border rounded p-2 d-flex flex-column" [class.not-current-month]="!day.isCurrentMonth">
    
    <!-- Top row: Date number, Toggle, Edit icon -->
    <div *ngIf="day.isCurrentMonth && isDateInProductRange(day)" class="d-flex justify-content-between align-items-start w-100 mb-2">
      <div class="day-header fw-bold text-dark">
        {{ getDayNumber(day) }}
      </div>
      
      <!-- Toggle slider for dates in range -->
      <div class="toggle-slider-container">
        <input
          [id]="'toggle-' + formatDateKey(day.date)"
          type="checkbox"
          class="toggle-slider-checkbox"
          [checked]="getInventoryPoolDataForDay(day)?.isOpen"
          (change)="onToggleReservation(day)"
          [attr.aria-label]="getInventoryPoolDataForDay(day)?.isOpen ? 'Park Open' : 'Park Closed'"
        />
        <label [for]="'toggle-' + formatDateKey(day.date)" class="toggle-slider" [ngClass]="'toggle-' + getToggleStatusClass(getInventoryPoolDataForDay(day))"></label>
      </div>
      
      <!-- Edit icon -->
      <i *ngIf="getInventoryPoolDataForDay(day)" class="fa-solid fa-pen text-muted cursor-pointer" role="button" tabindex="0" (click)="onEditCapacity(day, $event)" (keydown.enter)="onEditCapacity(day, $event)" (keydown.space)="onEditCapacity(day, $event)" style="font-size: 0.9rem; cursor: pointer;"></i>
      <!-- Placeholder to maintain spacing when no pool data -->
      <div *ngIf="!getInventoryPoolDataForDay(day)" style="width: 0.9rem;"></div>
    </div>

    <!-- Top row for out-of-range dates (just date number) -->
    <div *ngIf="day.isCurrentMonth && !isDateInProductRange(day)" class="d-flex justify-content-between align-items-start w-100 mb-2">
      <div class="day-header fw-bold text-dark">
        {{ getDayNumber(day) }}
      </div>
    </div>
    
    <!-- Out of product range - clickable placeholder to add capacity and extend range -->
    <div *ngIf="day.isCurrentMonth && !isDateInProductRange(day)" class="empty-capacity-placeholder bg-light border border-2 border-dashed rounded p-2 w-100 text-center cursor-pointer small text-muted flex-grow-1 d-flex align-items-center justify-content-center" role="button" tabindex="0" (click)="onEditOutOfRangeDate(day, $event)" (keydown.enter)="onEditOutOfRangeDate(day, $event)" (keydown.space)="onEditOutOfRangeDate(day, $event)">
      <span class="add-capacity-text d-block">Click to add capacity</span>
    </div>

    <!-- Passes info for existing inventory pools - centered at 75% width -->
    <div *ngIf="getInventoryPoolDataForDay(day) as poolData" class="capacity-info border-start border-4 border-info rounded p-2 mx-auto mt-3" style="width: 75%; background-color: #D8EAFD;" [class.opacity-50]="!poolData.isOpen" [style.cursor]="'default'">
      <div class="d-flex justify-content-between w-100 small">
        <span class="fw-semibold">Passes:</span>
        <span>{{ poolData.capacity }}</span>
      </div>
      <div class="d-flex justify-content-between w-100 small">
        <span class="fw-semibold">Reserved:</span>
        <span>{{ poolData.capacity - poolData.available }}</span>
      </div>
    </div>

    <!-- Empty placeholder for dates in range without inventory pools (clickable to add) -->
    <div *ngIf="day.isCurrentMonth && isDateInProductRange(day) && !getInventoryPoolDataForDay(day)" class="empty-capacity-placeholder bg-light border border-2 border-dashed rounded p-2 text-center cursor-pointer small text-muted flex-grow-1 d-flex align-items-center justify-content-center" role="button" tabindex="0" style="width: 75%; margin: 0 auto; cursor: pointer;" (click)="onEditEmptyDate(day, $event)" (keydown.enter)="onEditEmptyDate(day, $event)" (keydown.space)="onEditEmptyDate(day, $event)">
      <span class="add-capacity-text d-block">Click to add capacity</span>
    </div>

    <!-- Override badge (always reserves space) - moved to bottom -->
    <div *ngIf="day.isCurrentMonth && isDateInProductRange(day)" class="override-badge w-50 mx-auto mt-2" style="min-height: 24px;">
      <span *ngIf="hasBeenEdited(day)" class="badge bg-warning text-dark w-100">override</span>
    </div>
  </div>
</div>
